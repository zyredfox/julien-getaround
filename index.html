<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1c2e" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Bilan locations & dépenses Getaround — outil privé."
    />
    <title>Accueil | Julien Getaround</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem("julien-getaround:ui-prefs") || "{}");
        var isDark = prefs.theme === "dark";
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        document.documentElement.dataset.density = prefs.density === "compact" ? "compact" : "comfortable";
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
